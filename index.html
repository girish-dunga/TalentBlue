<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalentBlue</title>
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main id="login" class="login" hidden>
  <form class="login-card" id="loginform" novalidate>
    <div class="brand"><img class="brand-mark" src="images/logo.svg" alt="" aria-hidden="true"><div><b>TalentBlue</b><small>Smart Ops. Smart People.</small></div></div>
    <div><h1>Sign in</h1><p class="muted" style="margin-top:4px">Use your TalentBlue account to continue.</p></div>
    <div class="field"><label for="li-email">Email</label><input id="li-email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="li-pw">Password</label><input id="li-pw" type="password" autocomplete="current-password" required></div>
    <p id="li-err" role="alert" style="color:var(--bad);font-size:.86rem" hidden></p>
    <button class="btn primary" type="submit">Sign in</button>
    <div><div class="demo-acc" id="demo-acc"></div></div>
    
  </form>
</main>
<div class="app" id="app" hidden>
  <aside class="rail">
    <div class="brand"><img class="brand-mark" src="images/logo.svg" alt="" aria-hidden="true"><div><b>TalentBlue</b><small>Smart Ops. Smart People.</small></div><button class="btn theme-btn" id="themeBtn" data-act="theme"></button></div>
    <div class="role-row">
      <div class="role-pick"><label class="eyebrow" for="role">Viewing as</label>
        <select id="role">
          <option value="coordinator">Interview coordinator</option>
          <option value="panel">Panel member</option>
          <option value="ta">TA partner</option>
          <option value="hm">Hiring manager</option>
        </select></div>
      <div class="who" id="who"></div>
      <button class="btn small signout" data-act="signout">Sign out</button>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="rail-foot">
      <span>Sample data · demo date Fri 2 Oct 2026. Changes are kept in this browser.</span>
      <button class="btn small" data-act="reset">Reset demo data</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="scrim" class="scrim" hidden data-act="closeDrawer"></div>
<aside id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title"></aside>
<div id="toast" class="toast" hidden role="status"></div>

<script src="js/app.js"></script>
</body>
</html>
