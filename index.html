<style>
/* Layout: operations console. Fixed left rail (role + nav), working canvas on the right, slide-in drawer for detail and forms. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EDF0F5; --line:#DCE1EA; --fg:#131926; --muted:#5A6477;
  --accent:#0070AD; --accent-2:#17ABDA; --accent-ink:#FFFFFF; --accent-soft:#E0F0F9;
  --weekend:#A85A0C; --weekend-soft:#FBEEDB;
  --ok:#16794A; --ok-soft:#DFF2E7; --warn:#946000; --warn-soft:#FAF0D4; --bad:#BC2F28; --bad-soft:#FBE3E1;
  --demand:#8A93A6;
  --shadow:0 10px 30px rgba(19,25,38,.14);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E121A; --surface:#161B25; --surface-2:#1E2430; --line:#2B3241; --fg:#E6E9F0; --muted:#98A1B4;
  --accent:#17ABDA; --accent-2:#0070AD; --accent-ink:#0E121A; --accent-soft:#0F2E40;
  --weekend:#E8A25C; --weekend-soft:#382815;
  --ok:#52C487; --ok-soft:#15301F; --warn:#E3B24C; --warn-soft:#342910; --bad:#F27D73; --bad-soft:#3A1D1B;
  --demand:#6B7489; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E121A; --surface:#161B25; --surface-2:#1E2430; --line:#2B3241; --fg:#E6E9F0; --muted:#98A1B4;
  --accent:#17ABDA; --accent-2:#0070AD; --accent-ink:#0E121A; --accent-soft:#0F2E40;
  --weekend:#E8A25C; --weekend-soft:#382815;
  --ok:#52C487; --ok-soft:#15301F; --warn:#E3B24C; --warn-soft:#342910; --bad:#F27D73; --bad-soft:#3A1D1B;
  --demand:#6B7489; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem;line-height:1.2}
h2{font-size:1.1rem}
h3{font-size:.95rem;font-family:var(--f-body);font-weight:600;letter-spacing:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.15rem}
.brand small{display:block;color:var(--muted);font-size:.72rem;line-height:1.2}
.theme-btn{margin-left:auto;width:32px;height:32px;padding:0;justify-content:center;font-size:1rem}
.role-pick label{display:block;padding:0 6px 6px}
.role-pick select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.who{padding:0 6px;font-size:.8rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .count{font-family:var(--f-mono);font-size:.72rem;background:var(--bad);color:var(--surface);border-radius:10px;padding:0 7px}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.login-card .brand{padding:0}
.login-card .btn.primary{justify-content:center;padding-block:10px}
.login-card .field input{padding:9px 11px}
.demo-acc{display:flex;flex-direction:column;gap:6px}
.demo-acc button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);font-size:.84rem}
.demo-acc button:hover{border-color:var(--accent)}
.demo-acc button:focus-visible{outline:2px solid var(--accent)}
.demo-acc span{color:var(--muted)}
.signout{align-self:flex-start;margin:4px 6px 0}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px;font-size:.75rem;color:var(--muted)}

.main{padding-block:22px 60px;padding-inline:28px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.topbar .sub{color:var(--muted);margin-top:4px;max-width:70ch}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:var(--r);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.small{padding:4px 9px;font-size:.82rem}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.bell{position:relative}
.bell .dot{position:absolute;top:-5px;right:-5px;background:var(--bad);color:var(--surface);font-family:var(--f-mono);font-size:.65rem;border-radius:9px;padding:0 5px;line-height:16px}

.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--f-body);font-size:.85rem;color:var(--muted);font-weight:400}
.kpi .t{font-size:.78rem;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.we{background:var(--weekend-soft);color:var(--weekend)}
.pill.plain{background:var(--surface-2);color:var(--muted)}
.lvl{font-family:var(--f-mono);font-size:.7rem;font-weight:500;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 4px;line-height:1.5}
.lvl.l2{background:var(--accent);color:var(--accent-ink)}
.tag{font-size:.75rem;background:var(--surface-2);border-radius:4px;padding:1px 7px;white-space:nowrap}

.insights{display:flex;flex-direction:column}
.insight{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.insight:first-child{border-top:0;padding-top:0}
.sev{width:9px;height:9px;border-radius:50%;margin-top:6px}
.sev.critical{background:var(--bad)} .sev.warning{background:var(--warn)} .sev.info{background:var(--accent)}
.insight b{font-weight:600}
.insight p{color:var(--muted);font-size:.86rem;margin-top:2px}

.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lab{font-size:.74rem;font-weight:600;color:var(--muted)}
.field select,.field input,.field textarea{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.field textarea{min-height:70px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* roster grid */
.roster-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.roster{border-collapse:separate;border-spacing:0;font-size:.8rem;width:auto;min-width:100%}
.roster th,.roster td{border-bottom:1px solid var(--line);padding:0;text-transform:none;letter-spacing:0}
.roster thead th{padding:8px 4px;text-align:center;font-family:var(--f-mono);font-weight:500;color:var(--muted);font-size:.72rem;line-height:1.3;background:var(--surface);position:sticky;top:0}
.roster thead th.today{color:var(--accent);font-weight:600}
.roster th.rowh{position:sticky;left:0;background:var(--surface);text-align:left;padding:8px 12px;min-width:150px;font-family:var(--f-body);font-size:.82rem;color:var(--fg);font-weight:500;z-index:1;border-right:1px solid var(--line)}
.roster td button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;height:46px;font-family:var(--f-mono);position:relative;border-right:1px solid var(--surface)}
.roster td button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.roster td button b{font-weight:500;font-size:.9rem}
.roster td button small{font-size:.62rem;color:var(--muted)}
.roster td.past button{opacity:.45}
.roster td.gap button::after{content:"";position:absolute;inset:3px;border:1.5px solid var(--bad);border-radius:5px}
.roster td.short button::after{content:"";position:absolute;inset:3px;border:1.5px dashed var(--warn);border-radius:5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);align-items:center;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}

/* availability calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:0 4px}
.day{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:96px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day:hover{border-color:var(--accent)}
.day:focus-visible{outline:2px solid var(--accent)}
.day .dn{font-family:var(--f-mono);font-size:.82rem;display:flex;justify-content:space-between;gap:4px}
.day .times{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.day.st-A{border-left:4px solid var(--ok)}
.day.st-P{border-left:4px solid var(--warn)}
.day.st-N{border-left:4px solid var(--bad);background:var(--surface-2)}
.day.we{background:var(--weekend-soft)}
.day.off{cursor:default;opacity:.55;background:var(--surface-2)}
.day.off:hover{border-color:var(--line)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day .drv{font-size:.68rem;color:var(--weekend);font-weight:600;line-height:1.3}
.day .bk{font-size:.68rem;color:var(--accent);font-weight:600}

/* chips as toggles */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-size:.8rem;cursor:pointer;background:var(--surface)}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.chip.locked span{border-style:dashed}
.chip.text span{font-family:var(--f-body)}

/* slot list */
.daygroup{margin-bottom:18px}
.daygroup h3{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.slotrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.slotrow .t{font-family:var(--f-mono);font-weight:500}
.slotrow .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center}
.barrow .lab{font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barpair{display:flex;flex-direction:column;gap:3px}
.bar{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.bar i{display:block;height:9px;border-radius:0 4px 4px 0;min-width:2px}
.bar i.cap{background:var(--accent)} .bar i.dem{background:var(--demand)}
.bar i.fun{background:var(--accent);height:22px}
.meter{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.we i{background:var(--weekend)}

/* drive cards */
.drive{display:flex;flex-direction:column;gap:12px}
.drive-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.drive-date{font-family:var(--f-display);font-size:1.25rem;color:var(--weekend)}

/* copilot */
.chat{display:flex;flex-direction:column;gap:12px;min-height:300px}
.msg{max-width:min(720px,100%);padding:10px 14px;border-radius:10px;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);min-width:0;width:100%}
.msg.bot table{margin-top:8px}
.msg .src{font-size:.72rem;color:var(--muted);margin-top:6px}
.chatbar{display:flex;gap:8px;margin-top:14px}
.chatbar input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.38);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-body{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{all:unset;cursor:pointer;font-size:1.4rem;line-height:1;color:var(--muted);padding:2px 6px;border-radius:4px}
.x:focus-visible{outline:2px solid var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rec{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rec.top{border-color:var(--accent)}
.rec-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.score{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:500}
.reasons{display:flex;flex-wrap:wrap;gap:5px}
.note{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.84rem;color:var(--muted)}
.note.we{background:var(--weekend-soft);color:var(--fg)}
.note.bad{background:var(--bad-soft);color:var(--fg)}
.banner{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:10px;background:var(--accent-soft);margin-bottom:16px}
.banner.warn{background:var(--warn-soft)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.notif{padding:10px 0;border-top:1px solid var(--line)}
.notif.unread b{color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow);font-size:.9rem}

@media (max-width:980px){.cols-2,.cols-3-1{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px;gap:12px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap}
  .rail-foot{display:none}
  .main{padding-inline:16px}

/* ---------- derived data ---------- */
let C={};
function compute(){
  const booked=new Map();
  for(const i of S.interviews) if(i.status!=='Cancelled'&&i.status!=='Needs reassignment') booked.set(`${i.pid}|${i.date}|${i.time}`,i);
  const slots=[];
  for(const p of S.panels){const av=S.avail[p.id]||{};
    for(const d of DAYS){const a=av[d]; if(!a||a.s==='N') continue;
      for(const t of a.slots) slots.push({p,date:d,time:t,iv:booked.get(`${p.id}|${d}|${t}`)||null});}}
  C={booked,slots};
}
function cap(skill,L,filter=()=>true){let off=0,bk=0;
  for(const s of C.slots) if(s.p.skills.includes(skill)&&s.p.levels.includes(L)&&filter(s)){off++; if(s.iv) bk++;}
  return {off,bk,open:off-bk};}
function weekLoad(pid,d){const w=wk(d);return S.interviews.filter(i=>i.pid===pid&&wk(i.date)===w&&i.status!=='Cancelled'&&i.status!=='Needs reassignment').length}
function shortfalls(){const out=[];
  for(const s of SKILLS) for(const L of ['L1','L2']){const c=cap(s,L,x=>!isWE(x.date)); const dm=S.demand[s][L];
    if(c.off<dm) out.push({skill:s,L,off:c.off,dm,gap:dm-c.off,pctShort:Math.round((dm-c.off)/dm*100)});}
  return out.sort((a,b)=>b.pctShort-a.pctShort);}
function l2Gaps(days=10){const out=[];const end=addDays(TODAY,days);
  for(const s of SKILLS){const ds=WEEKDAYS.filter(d=>d>TODAY&&d<=end&&cap(s,'L2',x=>x.date===d).off===0); if(ds.length) out.push({skill:s,days:ds});}
  return out;}
function overloads(){const out=[];
  for(const p of S.panels) for(const w of [2,3,4,5]){const n=S.interviews.filter(i=>i.pid===p.id&&wk(i.date)===w&&i.date>=TODAY&&i.status==='Scheduled').length; if(n>p.cap) out.push({p,w,n});}
  return out;}
const weekStart=w=>DAYS.find(d=>wk(d)===w&&dw(d)===1)||DAYS.find(d=>wk(d)===w);
function assignDrive(drv){const used=new Set();const rows=[];
  const free=(s,L)=>S.panels.filter(p=>!used.has(p.id)&&p.skills.includes(s)&&p.levels.includes(L)&&S.avail[p.id]?.[drv.date]?.s&&S.avail[p.id][drv.date].s!=='N');
  for(const [s,c] of Object.entries(drv.demand)){
    const needL2=Math.ceil(c*0.4/5), needL1=Math.ceil(c/5);
    const l2=free(s,'L2').sort((a,b)=>a.levels.length-b.levels.length||(a.skills[0]===s?-1:1)).slice(0,needL2); l2.forEach(p=>used.add(p.id));
    const l1=free(s,'L1').sort((a,b)=>(a.skills[0]===s?-1:1)).slice(0,needL1); l1.forEach(p=>used.add(p.id));
    rows.push({skill:s,c,needL1,needL2,l1,l2});}
  const need=rows.reduce((a,r)=>a+r.needL1+r.needL2,0), got=rows.reduce((a,r)=>a+Math.min(r.l1.length,r.needL1)+Math.min(r.l2.length,r.needL2),0);

function insights(){
  const out=[];
  const imp=impacted(); if(imp.length) out.push({sev:'critical',title:`${imp.length} booked interview${imp.length>1?'s':''} need${imp.length>1?'':'s'} a new panel`,body:`Triggered by reported unavailability. Candidates are on hold until reassigned.`,act:'go',arg:'exceptions',label:'Reassign'});
  for(const f of shortfalls().slice(0,4)){

    if(f.L==='L2'||f.off===0) out.push({sev:f.off===0?'critical':'warning',title:`${sk(f.skill)} ${f.L} panel capacity may fall short by ${f.pctShort}%`,body:`${f.off} slots offered against ${f.dm} planned ${f.L} interviews this month. ${owners.length} panel member${owners.length===1?'':'s'} mapped${owners.filter(p=>!p.submitted).length?`, ${owners.filter(p=>!p.submitted).map(p=>p.name).join(', ')} not yet submitted`:''}.`,act:'askSlots',arg:f.skill+'|'+f.L,label:'Ask for slots'});
    else { // weekly recommendation
      let worst=null; for(const w of [2,3,4,5]){const wd=WEEKDAYS.filter(d=>wk(d)===w);const dm=Math.round(f.dm*wd.length/WEEKDAYS.length);const off=cap(f.skill,f.L,x=>!isWE(x.date)&&wk(x.date)===w).off; if(!worst||dm-off>worst.gap) worst={w,gap:dm-off};}
      out.push({sev:'warning',title:`Week of ${fd(weekStart(worst.w)).replace(/^\w+ /,'')} ${sk(f.skill)} demand is high`,body:`Suggest allocating ${Math.max(worst.gap,f.gap)} additional ${f.L} slots. October has ${f.off} ${f.L} slots for ${f.dm} planned interviews.`,act:'askSlots',arg:f.skill+'|'+f.L,label:'Ask for slots'});}
  }
  for(const g of l2Gaps().slice(0,2)) out.push({sev:'warning',title:`${sk(g.skill)} L2 coverage unavailable on ${g.days.slice(0,3).map(fd).join(', ')}${g.days.length>3?` and ${g.days.length-3} more`:''}`,body:'No L2 panel has offered a slot on these days. TA cannot book L2 rounds there.',act:'askSlots',arg:g.skill+'|L2',label:'Ask for slots'});
  const pend=pending(); if(pend.length) out.push({sev:pct(S.panels.length-pend.length,S.panels.length)<90?'warning':'info',title:`${pend.length} panel members have not submitted October availability`,body:`Submission rate ${pct(S.panels.length-pend.length,S.panels.length)}% against a 90% target. The availability agent can follow up now.`,act:'remindAll',label:'Send reminders'});
  for(const drv of DRIVES.filter(d=>d.date>=TODAY)){const a=assignDrive(drv); if(a.ready<100){const miss=a.rows.filter(r=>r.l1.length<r.needL1||r.l2.length<r.needL2).map(r=>`${sk(r.skill)} ${r.l1.length<r.needL1?`${r.needL1-r.l1.length} L1`:''}${r.l1.length<r.needL1&&r.l2.length<r.needL2?' + ':''}${r.l2.length<r.needL2?`${r.needL2-r.l2.length} L2`:''}`);
    out.push({sev:'info',title:`${drv.name} (${fd(drv.date)}) is ${a.ready}% staffed`,body:`Still needed: ${miss.join('; ')}.`,act:'requestDrive',arg:drv.id,label:'Request panels'});break;}}
  for(const o of overloads().slice(0,1)) out.push({sev:'info',title:`${o.p.name} has ${o.n} interviews in the week of ${fd(weekStart(o.w)).replace(/^\w+ /,'')}`,body:`Weekly limit is ${o.p.cap}. Consider moving a slot to a lighter panel.`,act:'openPanel',arg:o.p.id,label:'View panel'});
  return out;
}
function recommend({skill,round,cexp,from,exactDate,exactTime,exclude,limit=3}){
  const sen=cexp>=8?'Senior':cexp>=4?'Mid':'Junior';const out=[];
  for(const p of S.panels){ if(p.id===exclude||!p.skills.includes(skill)||!p.levels.includes(round)) continue;
    const open=C.slots.filter(s=>s.p===p&&!s.iv&&s.date>=from&&(!exactDate||s.date===exactDate)&&(!exactTime||s.time===exactTime)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    if(!open.length) continue; const sl=open[0]; const prim=p.skills[0]===skill;
    let sc=prim?40:28; const why=[`${sk(skill)} ${round}${prim?'':' (secondary)'}`];
    const fit=sen==='Senior'?(p.exp>=10?20:p.exp>=8?12:4):sen==='Mid'?(p.exp>=7?18:12):16; sc+=fit; why.push(`${p.exp} yrs, ${fit>=16?'good fit for':fit>=12?'workable for':'junior for'} a ${sen.toLowerCase()} candidate`);
    const load=weekLoad(p.id,sl.date); sc+=Math.max(0,20-Math.round(load/p.cap*20)); why.push(`${load}/${p.cap} interviews that week`);
    const days=dnum(sl.date)-dnum(from); sc+=Math.max(0,20-days*2); why.push(`Earliest ${fd(sl.date)} ${sl.time}`);
    out.push({p,slot:sl,score:Math.min(99,sc),why});}
  return out.sort((a,b)=>b.score-a.score).slice(0,limit);
}
function reconcile(by){const newly=[];
  for(const i of S.interviews){ if(i.status!=='Scheduled'||i.date<TODAY) continue; const a=S.avail[i.pid]?.[i.date];
    if(!a||a.s==='N'||!a.slots.includes(i.time)){i.status='Needs reassignment';i.impact=a?.reason||'Slot withdrawn';newly.push(i);}}
  return newly;}

const PROMPTS=['Show available React L1 panels for next week','Which technologies are facing capacity shortages?','Generate weekend drive roster','Who has not submitted availability?','Show utilisation report for October','Any scheduling conflicts?'];
VIEWS.copilot=()=>header('Copilot','Ask about panels, capacity and rosters in plain language. Answers come from live roster data.')+
  `<section class="card"><div class="chat" id="chat">${ui.chat.length?ui.chat.map(m=>m.me?`<div class="msg me">${esc(m.text)}</div>`:`<div class="msg bot">${m.html}</div>`).join(''):`<div class="msg bot">Hi ${ROLES[ui.role].user.split(' ')[0]}. Try one of the questions below, or type your own.</div>`}</div>

  <form class="chatbar" id="chatform"><label for="q" class="eyebrow" style="position:absolute;left:-9999px">Question</label><input id="q" autocomplete="off" placeholder="e.g. Show available Java L2 panels this week"><button class="btn primary" type="submit">Ask</button></form></section>`;

const ALIAS=[['react \\+ next|react next|next\\.?js','React + Next.js'],['java ?\\+ ?angular','Full Stack (Java+Angular)'],['java ?\\+ ?react','Full Stack (Java+React)'],['full ?stack','Full Stack (Java+React)'],['ux','UX Design'],['mern','MERN'],['mean','MEAN'],['mobile','Mobile'],['node','Node.js'],['angular','Angular'],['react','React'],['java','Java']];
function answer(q){
  const s=q.toLowerCase();
  const skill=(ALIAS.find(([re])=>new RegExp('\\b('+re+')\\b').test(s))||[])[1];
  const L=/\bl2\b/.test(s)?'L2':/\bl1\b/.test(s)?'L1':null;
  let from=TODAY,to='2026-10-31',rl='this month';
  if(/next week/.test(s)){from='2026-10-05';to='2026-10-09';rl='next week (5–9 Oct)'} else if(/this week/.test(s)){from=TODAY;to='2026-10-04';rl='this week'} else if(/tomorrow|monday/.test(s)){from=to='2026-10-05';rl='Mon 5 Oct'}
  if(/not submitted|pending|haven.?t|have not|missing/.test(s)){const p=pending();
    return `${p.length} panel members have not submitted October availability:<table><thead><tr><th>Name</th><th>Technology</th><th>Level</th><th class="r">Reminders</th></tr></thead><tbody>${p.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.skills.map(sk).join(', '))}</td><td>${x.levels.join('/')}</td><td class="r num">${x.reminders}</td></tr>`).join('')}</tbody></table>${ui.role==='coordinator'?'<div style="margin-top:10px"><button class="btn small primary" data-act="remindAll">Send reminders now</button></div>':''}`;}
  if(/weekend|drive/.test(s)){const drv=DRIVES.find(d=>d.date>=TODAY);const a=assignDrive(drv);
    return `Draft roster for <b>${esc(drv.name)}</b>, ${fd(drv.date)} (${a.ready}% staffed):<table><thead><tr><th>Technology</th><th>L1 panels</th><th>L2 panels</th></tr></thead><tbody>${a.rows.map(r=>`<tr><td>${esc(sk(r.skill))} · ${r.c} candidates</td><td>${r.l1.map(p=>esc(p.name)).join(', ')||'—'} <span class="muted">(${r.l1.length}/${r.needL1})</span></td><td>${r.l2.map(p=>esc(p.name)).join(', ')||'—'} <span class="muted">(${r.l2.length}/${r.needL2})</span></td></tr>`).join('')}</tbody></table>`;}
  if(/utili[sz]/.test(s)){return `Slot utilisation for October so far:<table><thead><tr><th>Technology</th><th class="r">Offered</th><th class="r">Booked</th><th class="r">Utilisation</th></tr></thead><tbody>${SKILLS.map(x=>{const a=cap(x,'L1'),b=cap(x,'L2');const o=a.off+b.off,k=a.bk+b.bk;return `<tr><td>${esc(sk(x))}</td><td class="r num">${o}</td><td class="r num">${k}</td><td class="r num">${pct(k,o)}%</td></tr>`}).join('')}</tbody></table><div class="src">Panels with both levels count toward L1 and L2.</div>`;}
  if(/conflict|clash|double|overlap/.test(s)){const g=l2Gaps(),o=overloads(),i=impacted();
    return `<b>${i.length}</b> interviews need reassignment after reported unavailability.<br>${g.map(x=>`${esc(sk(x.skill))} L2 coverage unavailable on ${x.days.map(fd).join(', ')}.`).join('<br>')||'No L2 coverage gaps in the next 10 working days.'}<br>${o.map(x=>`${esc(x.p.name)} is over their weekly limit (${x.n}/${x.p.cap}).`).join('<br>')}`;}
  if(/short|capacity|gap|demand/.test(s)&&!/available|free/.test(s)){const f=shortfalls();
    return f.length?`${new Set(f.map(x=>x.skill)).size} technologies are short of planned weekday capacity:<table><thead><tr><th>Technology</th><th>Level</th><th class="r">Offered</th><th class="r">Planned</th><th class="r">Short by</th></tr></thead><tbody>${f.map(x=>`<tr><td>${esc(sk(x.skill))}</td><td>${x.L}</td><td class="r num">${x.off}</td><td class="r num">${x.dm}</td><td class="r num">${x.pctShort}%</td></tr>`).join('')}</tbody></table>`:'Every technology has enough offered slots for planned demand.';}
  if(skill&&/avail|free|open|slot|panel|who/.test(s)){
    const levels=L?[L]:['L1','L2'];
    const rows=S.panels.filter(p=>p.skills.includes(skill)&&levels.some(l=>p.levels.includes(l))).map(p=>{const o=C.slots.filter(x=>x.p===p&&!x.iv&&x.date>=from&&x.date<=to);return {p,o}}).filter(r=>r.o.length).sort((a,b)=>b.o.length-a.o.length);
    return rows.length?`${rows.length} ${esc(sk(skill))} ${L||''} panel${rows.length>1?'s have':' has'} open slots ${rl}:<table><thead><tr><th>Panel</th><th>Level</th><th class="r">Open</th><th>Next open slot</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.p.name)}</td><td>${r.p.levels.join('/')}</td><td class="r num">${r.o.length}</td><td class="mono">${fd(r.o[0].date)} ${r.o[0].time}</td></tr>`).join('')}</tbody></table>`:`No ${esc(sk(skill))} ${L||''} panels have open slots ${rl}.`;}
  return null;
}

async function ask(q){
  ui.chat.push({me:true,text:q});
  const local=answer(q);
  if(local){ui.chat.push({html:local});render();scrollChat();return;}
  const idx=ui.chat.push({html:'<span class="muted">Thinking…</span>'})-1; render();scrollChat();
  let sample=null; try{sample=window.claude?.use?await window.claude.use('sample'):null}catch(e){}
  if(!sample){ui.chat[idx].html=`I can answer questions about panel availability, capacity shortages, weekend drive rosters, pending submissions, utilisation and conflicts. Try naming a technology and level, for example “Show available Java L2 panels this week”.`;render();scrollChat();return;}
  const prompt=`You are the coordinator copilot inside TalentBlue, a recruitment operations tool for Capgemini interview panels and rosters. Answer the question using only this October 2026 data (JSON). Be concise: under 120 words, plain text, no markdown.\n\nDATA: ${contextSummary()}\n\nQUESTION: ${q}`;
  try{const r=await sample(prompt,{modelTier:'quick',onText:({text})=>{ui.chat[idx].html=esc(text);const el=document.querySelectorAll('#chat .msg.bot');if(el.length)el[el.length-1].textContent=text;}});
    ui.chat[idx].html=esc(r.text)+'<div class="src">Answered by Claude from the roster summary.</div>';}
  catch(e){ui.chat[idx].html=e&&e.code==='not_granted'?'Free-form answers need permission to ask Claude. The suggested questions work without it.':'I could not answer that one. Try a suggested question.';}
  render();scrollChat();
}

  if(!days.length||!ts.length){toast('Pick at least one day and one slot.');return;}
  let n=0;for(const d of WEEKDAYS){if(d<=TODAY||!days.includes(dw(d)))continue;const cur=S.avail[ME][d];if(keep&&cur&&cur.s==='N')continue;S.avail[ME][d]={s:ts.length>=2?'A':'P',slots:ts.slice()};n++;}
  afterAvailChange(`Applied weekly pattern (${ts.join(', ')}) to ${n} days`);};
A.unavail=()=>{const opts=DAYS.filter(d=>d>TODAY&&(!isWE(d)||driveOn(d)));
  openDrawer('Report unavailability','Your coordinator is told at once, and any affected interviews are reassigned.',
  `<form id="uform" class="grid" style="gap:14px"><div class="row2"><div class="field"><label for="u-from">From</label><select id="u-from">${opts.map(d=>`<option value="${d}">${fd(d)}</option>`).join('')}</select></div>
  <div class="field"><label for="u-to">To</label><select id="u-to">${opts.map(d=>`<option value="${d}">${fd(d)}</option>`).join('')}</select></div></div>
  <div class="field"><span class="lab">Reason</span><div class="chips">${UNAVAIL_TYPES.map((r,i)=>`<label class="chip text"><input type="radio" name="ur" id="ur-${i}" value="${r}" ${i===0?'checked':''}><span>${r}</span></label>`).join('')}</div></div>
  <div class="field"><span class="lab">Affected time</span><div class="chips"><label class="chip text"><input type="radio" name="uall" id="ua-1" value="all" checked><span>Whole day</span></label>${WD_SLOTS.map(t=>`<label class="chip"><input type="checkbox" name="ut" id="ut-${t.replace(':','')}" value="${t}"><span>${t}</span></label>`).join('')}</div><p class="muted" style="font-size:.78rem;margin-top:4px">Pick specific slots for a meeting conflict; leave them clear for the whole day.</p></div>
  <div class="field"><label for="u-note">Note for coordinator (optional)</label><textarea id="u-note" placeholder="e.g. Client UAT moved to this week"></textarea></div></form>
  <div id="u-impact"></div>`,
  `<button class="btn" data-act="closeDrawer">Cancel</button><button class="btn primary" data-act="saveUnavail">Report</button>`);};
A.saveUnavail=()=>{let a=$('#u-from').value,b=$('#u-to').value;if(b<a)[a,b]=[b,a];const reason=document.querySelector('[name=ur]:checked').value;const ts=[...document.querySelectorAll('[name=ut]:checked')].map(x=>x.value);
  for(const d of DAYS){if(d<a||d>b||(isWE(d)&&!driveOn(d)))continue;const cur=S.avail[ME][d];
    if(!ts.length||!cur||cur.s==='N'){S.avail[ME][d]={s:'N',slots:[],reason};continue;}
    const left=cur.slots.filter(t=>!ts.includes(t));S.avail[ME][d]=left.length?{s:'P',slots:left,reason}:{s:'N',slots:[],reason};}
  afterAvailChange(`Reported ${reason} for ${a===b?fd(a):`${fd(a)} to ${fd(b)}`}${ts.length?` (${ts.join(', ')})`:''}`);};
A.feedback=id=>{const i=S.interviews.find(x=>x.id===id);
  openDrawer('Interview feedback',`${esc(i.cand)} · ${esc(sk(i.skill))} ${i.round} · ${fd(i.date)} ${i.time}`,
  `<form id="fform" class="grid" style="gap:14px"><div class="field"><span class="lab">Overall rating</span><div class="chips">${[1,2,3,4,5].map(n=>`<label class="chip"><input type="radio" name="fr" id="fr-${n}" value="${n}" ${n===4?'checked':''}><span>${n}</span></label>`).join('')}</div></div>
  <div class="field"><span class="lab">Decision</span><div class="chips">${['Selected','Rejected','On hold'].map((d,k)=>`<label class="chip text"><input type="radio" name="fd" id="fd-${k}" value="${d}" ${k===0?'checked':''}><span>${d==='Selected'?`Select for ${i.round==='L1'?'L2':'offer'}`:d==='Rejected'?'Reject':'On hold'}</span></label>`).join('')}</div></div>
  <div class="field"><label for="f-c">Comments</label><textarea id="f-c" placeholder="Strengths, gaps, and anything the next round should probe"></textarea></div></form>`,
  `<button class="btn" data-act="closeDrawer">Cancel</button><button class="btn primary" data-act="saveFeedback" data-arg="${id}">Submit feedback</button>`);};
A.saveFeedback=id=>{const i=S.interviews.find(x=>x.id===id);const dec=document.querySelector('[name=fd]:checked').value;
  i.status=dec;i.feedback={rating:+document.querySelector('[name=fr]:checked').value,decision:dec,comment:$('#f-c').value};
  notify('ta',`Feedback received for ${i.cand} (${sk(i.skill)} ${i.round}): ${dec}.`);log(P(i.pid).name,`Submitted feedback for ${i.cand}: ${dec}`);save();closeDrawer();render();toast('Feedback submitted. TA has been notified.');};

/* TA actions */
function bookForm(pid,d,t,pre={}){const p=P(pid);return `<div class="note">${esc(p.name)} · ${p.levels.join('/')} · ${p.exp} yrs · <span class="mono">${fd(d)} ${t}</span>${driveOn(d)?` · ${esc(driveOn(d).name)}`:''}</div>
  <form id="bform" class="grid" style="gap:14px"><div class="field"><label for="b-name">Candidate name</label><input id="b-name" value="${esc(pre.cand||'')}" placeholder="Full name" required></div>
  <div class="row2"><div class="field"><label for="b-exp">Experience (years)</label><input id="b-exp" type="number" min="0" max="40" value="${pre.cexp??5}"></div>
  <div class="field"><label for="b-mode">Mode</label><select id="b-mode"><option ${driveOn(d)?'':'selected'}>Virtual</option><option ${driveOn(d)?'selected':''}>Face to face</option></select></div></div>
  <p class="muted" id="b-err" style="color:var(--bad)" hidden></p></form>`;}
A.bookSlot=arg=>{const [pid,d,t]=arg.split('|');const f=ui.sf;
  openDrawer('Book interview',`${esc(sk(f.skill))} ${f.round}`,bookForm(pid,d,t),`<button class="btn" data-act="closeDrawer">Cancel</button><button class="btn primary" data-act="confirmBook" data-arg="${pid}|${d}|${t}|${esc(f.skill)}|${f.round}">Book interview</button>`);};
A.confirmBook=arg=>{const [pid,d,t,skill,round,fromIv]=arg.split('|');const name=$('#b-name').value.trim();
  if(!name){const e=$('#b-err');e.textContent='Enter the candidate’s name.';e.hidden=false;$('#b-name').focus();return;}
  compute(); if(C.booked.get(`${pid}|${d}|${t}`)){toast('That slot was just taken. Pick another.');closeDrawer();render();return;}
  if(fromIv){const old=S.interviews.find(x=>x.id===fromIv);if(old)old.status='Cancelled';}
  const drv=driveOn(d);S.seq++;
  const iv={id:'i'+S.seq,cand:name,cexp:+$('#b-exp').value||0,skill,round,date:d,time:t,pid,mode:$('#b-mode').value,ta:'Priya Nair',status:'Scheduled',driveId:drv?drv.id:null,feedback:null};
  S.interviews.push(iv);notify(pid,`New interview: ${name}, ${sk(skill)} ${round}, ${fd(d)} ${t} (${iv.mode}).`);
  log('Priya Nair',`Booked ${name} with ${P(pid).name} for ${sk(skill)} ${round} on ${fd(d)} ${t}`);save();closeDrawer();render();toast(`Booked. ${P(pid).name} has been notified and an invite goes to Outlook.`);};
A.smart=(pre)=>{const f=ui.sf;openDrawer('Smart schedule','The panel assignment agent ranks interviewers by skill, level, experience, load and availability.',
  `<form id="sform" class="grid" style="gap:14px"><div class="field"><label for="s-name">Candidate name</label><input id="s-name" placeholder="Full name"></div>
  <div class="row2"><div class="field"><label for="s-skill">Technology</label><select id="s-skill">${SKILLS.map(s=>`<option ${f.skill===s?'selected':''} value="${esc(s)}">${esc(sk(s))}</option>`).join('')}</select></div>
  <div class="field"><label for="s-round">Round</label><select id="s-round"><option ${f.round==='L1'?'selected':''}>L1</option><option ${f.round==='L2'?'selected':''}>L2</option></select></div></div>
  <div class="row2"><div class="field"><label for="s-exp">Candidate experience (years)</label><input id="s-exp" type="number" min="0" max="40" value="9"></div>
  <div class="field"><label for="s-from">Earliest date</label><select id="s-from">${DAYS.filter(d=>d>=TODAY).map(d=>`<option value="${d}">${fd(d)}</option>`).join('')}</select></div></div>
  <button type="button" class="btn primary" data-act="runSmart">Recommend panels</button></form><div id="recs"></div>`);};
A.runSmart=()=>{compute();const q={skill:$('#s-skill').value,round:$('#s-round').value,cexp:+$('#s-exp').value||0,from:$('#s-from').value};
  const r=recommend(q);const name=$('#s-name').value.trim()||'Candidate';
  $('#recs').innerHTML=`<h3 style="margin-bottom:8px">${esc(name)}: ${q.cexp>=8?'Senior':q.cexp>=4?'Mid-level':'Junior'} ${esc(sk(q.skill))} · ${q.round}</h3>`+(r.length?r.map((x,k)=>`<div class="rec ${k===0?'top':''}" style="margin-bottom:8px"><div class="rec-head"><b>${k+1}. ${esc(x.p.name)}</b><span class="score">${x.score}% match</span></div><div class="reasons">${x.why.map(w=>`<span class="tag">${esc(w)}</span>`).join('')}</div><div><button class="btn small ${k===0?'primary':''}" data-act="pickRec" data-arg="${x.p.id}|${x.slot.date}|${x.slot.time}|${esc(q.skill)}|${q.round}">Book ${fd(x.slot.date)} ${x.slot.time}</button></div></div>`).join(''):'<p class="note bad">No panel with this skill and level has an open slot from that date. Ask the coordinator to add capacity.</p>');};
A.pickRec=arg=>{const [pid,d,t,skill,round]=arg.split('|');const name=$('#s-name').value.trim();const exp=$('#s-exp').value;
  openDrawer('Book interview',`${esc(sk(skill))} ${round}`,bookForm(pid,d,t,{cand:name,cexp:+exp}),`<button class="btn" data-act="closeDrawer">Cancel</button><button class="btn primary" data-act="confirmBook" data-arg="${arg}">Book interview</button>`);};
A.cancelIv=id=>{const i=S.interviews.find(x=>x.id===id);
  openDrawer('Cancel interview?',`${esc(i.cand)} · ${fd(i.date)} ${i.time}`,`<p>The slot goes back into the roster and ${esc(P(i.pid).name)} is notified.</p>`,`<button class="btn" data-act="closeDrawer">Keep it</button><button class="btn primary" data-act="confirmCancel" data-arg="${id}">Cancel interview</button>`);};
A.confirmCancel=id=>{const i=S.interviews.find(x=>x.id===id);i.status='Cancelled';notify(i.pid,`Interview cancelled: ${i.cand}, ${fd(i.date)} ${i.time}.`);log(ROLES[ui.role].user,`Cancelled interview for ${i.cand} on ${fd(i.date)} ${i.time}`);save();closeDrawer();render();toast('Interview cancelled. The slot is open again.');};
A.reassign=arg=>{const [id,pid,d,t]=arg.split('|');const i=S.interviews.find(x=>x.id===id);const old=P(i.pid).name;const moved=d!==i.date||t!==i.time;
  Object.assign(i,{pid,date:d,time:t,status:'Scheduled',impact:null});
  notify(pid,`New interview assigned: ${i.cand}, ${sk(i.skill)} ${i.round}, ${fd(d)} ${t}.`);
  notify('ta',`${i.cand} reassigned from ${old} to ${P(pid).name}${moved?`, now ${fd(d)} ${t}. Please inform the candidate.`:' at the same time.'}`);
  log('Girish Dunga',`Reassigned ${i.cand} from ${old} to ${P(pid).name} (${fd(d)} ${t})`);save();closeDrawer();render();toast(`Reassigned to ${P(pid).name}. TA and the panel member were notified.`);};
A.reassignPick=id=>{const i=S.interviews.find(x=>x.id===id);const from=i.date<TODAY?TODAY:i.date;
  const same=recommend({skill:i.skill,round:i.round,cexp:i.cexp,from:i.date,exactDate:i.date,exactTime:i.time,exclude:i.pid,limit:3});
  const later=recommend({skill:i.skill,round:i.round,cexp:i.cexp,from,exclude:i.pid,limit:4}).filter(x=>!same.some(y=>y.p===x.p));
  const card=x=>`<div class="rec"><div class="rec-head"><b>${esc(x.p.name)}</b><span class="score">${x.score}% match</span></div><div class="reasons">${x.why.map(w=>`<span class="tag">${esc(w)}</span>`).join('')}</div><div><button class="btn small" data-act="reassign" data-arg="${i.id}|${x.p.id}|${x.slot.date}|${x.slot.time}">Assign ${fd(x.slot.date)} ${x.slot.time}</button></div></div>`;
  openDrawer('Reassign interview',`${esc(i.cand)} · ${esc(sk(i.skill))} ${i.round} · originally ${fd(i.date)} ${i.time}`,
  `<h3>Same time</h3>${same.length?same.map(card).join(''):'<p class="muted">No other panel is free at this exact time.</p>'}<h3>Other times</h3>${later.map(card).join('')||'<p class="muted">No alternatives this month.</p>'}`);};

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(!fn)return;e.preventDefault();fn(el.dataset.arg,el);});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='role') return setRole(t.value);
  if(t.dataset.pf){ui.pf[t.dataset.pf]=t.value;render();$('#'+t.id)?.focus();}
  if(t.dataset.sf){ui.sf[t.dataset.sf]=t.value;if(t.dataset.sf==='skill'||t.dataset.sf==='round')ui.sf.pid='';render();$('#'+t.id)?.focus();}
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='loginform')return signIn();if(e.target.id==='chatform'){const q=$('#q').value.trim();if(q)ask(q).then(()=>$('#q')?.focus());}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#drawer').hidden)closeDrawer();});
applyTheme(theme);
showAuth();
</script>
